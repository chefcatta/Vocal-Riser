name: Build Chef Riser

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.txt', 'install-mac.sh', 'screenshot.png']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configura
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compila
        run: cmake --build build --config Release --parallel 4

      - name: Impacchetta (Mac)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp -R "build/VocalRiser_artefacts/Release/AU/Chef Riser.component" dist/
          cp -R "build/VocalRiser_artefacts/Release/VST3/Chef Riser.vst3" dist/
          codesign --force --deep --sign - "dist/Chef Riser.component"
          codesign --force --deep --sign - "dist/Chef Riser.vst3"
          cd dist && zip -r -y ../ChefRiser-mac.zip .

      - name: Installer .pkg (Mac) - installa in Macintosh HD > Libreria > Audio > Plug-Ins
        if: runner.os == 'macOS'
        run: |
          set -e
          V=$(sed -n 's/^project(VocalRiser VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          R=pkgroot/Library/Audio/Plug-Ins
          mkdir -p "$R/Components" "$R/VST3"
          cp -R "dist/Chef Riser.component" "$R/Components/"
          cp -R "dist/Chef Riser.vst3" "$R/VST3/"
          plutil -lint packaging/mac/components.plist
          pkgbuild --root pkgroot --component-plist packaging/mac/components.plist --identifier com.chefcatta.chefriser.pkg \
                   --version "$V" --install-location / --scripts packaging/mac/scripts ChefRiser-core.pkg
          sed "s/VERSION/$V/" packaging/mac/distribution.xml > dist.xml
          productbuild --distribution dist.xml --package-path . ChefRiser-mac.pkg

      - name: Prova l'installer (Mac)
        if: runner.os == 'macOS'
        run: |
          set -e
          # simula una vecchia copia nella Libreria dell'utente: deve sparire e il plugin
          # deve finire solo in Macintosh HD > Libreria
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components" "$HOME/Library/Audio/Plug-Ins/VST3"
          cp -R "dist/Chef Riser.component" "$HOME/Library/Audio/Plug-Ins/Components/"
          cp -R "dist/Chef Riser.vst3" "$HOME/Library/Audio/Plug-Ins/VST3/"
          sudo installer -pkg ChefRiser-mac.pkg -target /
          ls -ld "/Library/Audio/Plug-Ins/Components/Chef Riser.component" "/Library/Audio/Plug-Ins/VST3/Chef Riser.vst3"
          test ! -e "$HOME/Library/Audio/Plug-Ins/Components/Chef Riser.component"
          test ! -e "$HOME/Library/Audio/Plug-Ins/VST3/Chef Riser.vst3"
          test -f "/Library/Audio/Plug-Ins/Components/Chef Riser.component/Contents/MacOS/Chef Riser"
          echo "OK: installato solo in /Library/Audio/Plug-Ins"
          auval -v aufx Vrs1 Vrsr | tail -5 || true

      - name: Impacchetta (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "build/VocalRiser_artefacts/Release/VST3/Chef Riser.vst3" -DestinationPath ChefRiser-windows.zip

      - name: Installer .exe (Windows) - installa in C:\Program Files\Common Files\VST3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(VocalRiser VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DMyVersion=$v" "/DSrcDir=$pwd\build\VocalRiser_artefacts\Release\VST3\Chef Riser.vst3" "/O$pwd" packaging\windows\ChefRiser.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC non riuscito" }
          Get-Item ChefRiser-windows-setup.exe

      - name: Prova l'installer e il plugin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dst = "C:\Program Files\Common Files\VST3\Chef Riser.vst3"
          # una vecchia versione gia presente deve essere sostituita
          New-Item -ItemType Directory -Force "$dst\Contents\vecchio" | Out-Null
          $p = Start-Process -Wait -PassThru .\ChefRiser-windows-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          if ($p.ExitCode -ne 0) { throw "installer: codice $($p.ExitCode)" }
          if (-not (Test-Path "$dst\Contents\x86_64-win\Chef Riser.vst3")) { throw "plugin non installato" }
          if (Test-Path "$dst\Contents\vecchio") { throw "la vecchia versione non e stata tolta" }
          Write-Host "OK: installato in $dst"
          # controllo del plugin con pluginval (Tracktion)
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pv.zip
          Expand-Archive pv.zip -DestinationPath pv
          $pv = Get-ChildItem pv -Recurse -Filter pluginval.exe | Select-Object -First 1
          $proc = Start-Process -Wait -PassThru -NoNewWindow $pv.FullName -ArgumentList '--strictness-level','5','--skip-gui-tests','--validate-in-process','--output-dir','pvlog','--validate',"`"$dst`""
          Get-ChildItem pvlog -Recurse -File | ForEach-Object { Get-Content $_.FullName | Select-Object -Last 40 }
          Write-Host "pluginval: codice $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { throw "pluginval ha trovato problemi" }
          # disinstallazione pulita
          $un = Get-ChildItem "${env:ProgramFiles}\Chef Catta\Chef Riser" -Filter "unins*.exe" | Select-Object -First 1
          Start-Process -Wait $un.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          if (Test-Path $dst) { throw "la disinstallazione non ha tolto il plugin" }
          Write-Host "OK: disinstallazione pulita"

      - uses: actions/upload-artifact@v4
        with:
          name: ChefRiser-${{ runner.os }}
          path: |
            ChefRiser-*.zip
            ChefRiser-mac.pkg
            ChefRiser-windows-setup.exe

  # Copia i plugin compilati nel branch "plugin" del repository,
  # così si scaricano direttamente da GitHub
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: actions/checkout@v4
        with:
          path: src

      - name: Leggi la versione
        id: ver
        run: |
          v=$(sed -n 's/^project(VocalRiser VERSION \([0-9.]*\)).*/\1/p' src/CMakeLists.txt)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          cp src/README.txt out/README.txt

      - name: Pubblica la release (pagina di download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Chef Riser ${{ steps.ver.outputs.version }}
          make_latest: true
          body: |
            **Chef Riser — CHEF CATTA dsp**

            Scarica il file per il tuo computer qui sotto (sezione *Assets*):
            - **ChefRiser-mac.pkg** — Mac (Apple Silicon e Intel): installer, mette Audio Unit e VST3 in Macintosh HD > Libreria > Audio > Plug-Ins
            - **ChefRiser-mac.zip** — Mac: gli stessi plugin da copiare a mano
            - **ChefRiser-windows-setup.exe** — Windows 64 bit: installer, mette il VST3 in C:\Program Files\Common Files\VST3
            - **ChefRiser-windows.zip** — Windows: lo stesso VST3 da copiare a mano

            Le istruzioni di installazione per ogni DAW sono nel file **README.txt** qui sotto.

            **Mac, installazione con un comando:** apri il Terminale e incolla
            `curl -fsSL https://raw.githubusercontent.com/chefcatta/Vocal-Riser/main/install-mac.sh | bash`
          files: |
            out/ChefRiser-mac.pkg
            out/ChefRiser-mac.zip
            out/ChefRiser-windows-setup.exe
            out/ChefRiser-windows.zip
            out/README.txt

      - name: Togli dalla release i file non piu usati
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete-asset "v${{ steps.ver.outputs.version }}" INSTALLAZIONE.md -y -R "${{ github.repository }}" || true

      - name: Pubblica nel branch "plugin"
        run: |
          cd out
          rm -f README.txt
          ls -la
          git init -q -b plugin
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Plugin compilato (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" plugin
